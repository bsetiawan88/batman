name: UpdraftPlus Onboarding
description: "Full wizard — auto-named screenshots"
env_file: updraft.env
stop_on_failure: true

variables:
  db_conn: "mysql://{{DB_USER}}:{{DB_PASS}}@{{DB_HOST}}:{{DB_PORT}}/{{DB_NAME}}"

.select_destination: &select_dest |
  (async (optionText) => {
  	const sleep = ms => new Promise(r => setTimeout(r, ms));
  	const visible = el => {
  		if (!el) return false;
  		const r = el.getBoundingClientRect();
  		const s = getComputedStyle(el);
  		return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
  	};
  	const clickElement = el => {
  		if (!el) throw new Error('Element not found');
  		const r = el.getBoundingClientRect();
  		const x = r.left + r.width / 2;
  		const y = r.top + r.height / 2;
  		for (const type of ['pointerdown','mousedown','pointerup','mouseup','click']) {
  			el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: window, clientX: x, clientY: y }));
  		}
  	};
  	const accordionButton = [...document.querySelectorAll('button')].find(el => visible(el) && el.textContent.includes('Backup destination'));
  	if (!accordionButton) throw new Error('Accordion not found');
   	if (accordionButton.getAttribute('aria-expanded') !== 'true') { clickElement(accordionButton); await sleep(500); }
   	const addBackupBtn = [...document.querySelectorAll('button')].find(el => visible(el) && el.textContent.includes('Add backup'));
   	if (addBackupBtn) { clickElement(addBackupBtn); await sleep(500); }
   	const combo = document.querySelector('button[role="combobox"]');
  	if (!combo) throw new Error('Combobox not found');
  	if (combo.getAttribute('aria-expanded') !== 'true') { clickElement(combo); for (let i = 0; i < 20; i++) { await sleep(100); if (combo.getAttribute('aria-expanded') === 'true') break; } }
  	let option = null;
  	for (let i = 0; i < 30; i++) { option = [...document.querySelectorAll('*')].find(el => visible(el) && el.textContent.trim() === optionText); if (option) break; await sleep(100); }
  	if (!option) throw new Error('Option not found: ' + optionText);
  	const target = option.closest('[role="option"]') || option.closest('[data-radix-collection-item]') || option;
  	clickElement(target);
  	console.log('Selected:', optionText);
  })

.click_manual: &click_manual |
  (async (choice) => {
  	const btns = document.querySelectorAll('[role="dialog"] button, button');
  	if (!btns.length) throw new Error('No buttons found');
  	const manuals = [...btns].filter(b => b.textContent.toLowerCase().includes('manual'));
  	if (!manuals.length) {
      console.log('[click_manual] Available buttons:', [...btns].map(b => b.textContent.trim()).join(', '));
      throw new Error('Manual button not found in dialog');
    }
  	let target;
  	if (choice === undefined || choice === null || choice === '' || choice === 'random') {
  		target = manuals[Math.floor(Math.random() * manuals.length)];
  	} else {
  		const n = parseInt(choice, 10);
  		target = !isNaN(n) ? manuals[n] : manuals.find(b => b.textContent.trim() === choice);
  		if (!target) throw new Error('Manual button not matched: ' + choice);
  	}
  	target.click();
  })

.select_option: &select_option |
  (async (opts) => {
  	const choice = (opts && typeof opts === 'object') ? opts.choice : opts;
  	const comboIndex = (opts && typeof opts === 'object') ? opts.comboIndex : undefined;
  	const sleep = ms => new Promise(r => setTimeout(r, ms));
  	const allCombos = [...document.querySelectorAll('button[role="combobox"]')];
  	let combo;
  	if (comboIndex === undefined || comboIndex === null) {
  		combo = allCombos.find(el => el.textContent.includes('Select an option'));
  	} else {
  		const n = parseInt(comboIndex, 10);
  		combo = !isNaN(n) ? allCombos[n] : allCombos.find(el => el.textContent.includes(comboIndex));
  	}
  	if (!combo) {
  		console.log('[select_option] no combobox found, searching options directly');
  	} else if (combo.getAttribute('aria-expanded') !== 'true') {
  		combo.click();
  		for (let i = 0; i < 20; i++) {
  			if (combo.getAttribute('aria-expanded') === 'true') break;
  			await sleep(100);
  		}
  	}
  	let options = [];
  	for (let i = 0; i < 30; i++) {
  		options = [...document.querySelectorAll('[role="option"]')];
  		if (options.length) break;
  		await sleep(100);
  	}
  	if (!options.length) throw new Error('No options found');
  	let target;
  	if (choice === undefined || choice === null || choice === '' || choice === 'random') {
  		target = options[Math.floor(Math.random() * options.length)];
  	} else {
  		const n = parseInt(choice, 10);
  		target = !isNaN(n) ? options[n] : options.find(o => o.textContent.trim() === choice);
  		if (!target) throw new Error('Option not matched: ' + choice);
  	}
  	target.click();
  	console.log('[select_option] selected:', target.textContent.trim());
  })

.google_oauth: &google_oauth |
  (async () => {
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const email = '{{GOOGLE_EMAIL}}';
    console.log('[gdrive] OAuth start, email:', email);
    // Click the account if shown
    for (let i = 0; i < 20; i++) {
      const el = document.querySelector('[data-email="' + email + '"]');
      if (el) { console.log('[gdrive] Click account:', email); el.click(); await sleep(2000); break; }
      await sleep(500);
    }
    // Click Continue/Allow/etc through consent screens
    const targets = ['Continue','Lanjutkan','Allow','Izinkan','Next','Berikutnya','Confirm','Konfirmasi','Grant access','Terima','Setuju'];
    for (let s = 0; s < 15; s++) {
      await sleep(1000);
      const all = document.querySelectorAll('button, [role="button"], input[type="submit"], div[role="button"], span[role="button"]');
      let found = null;
      for (const el of all) {
        const t = (el.textContent || '').trim();
        if (targets.some(x => t === x || t.startsWith(x))) { found = el; break; }
      }
      if (!found) {
        const names = [...all].map(e => (e.textContent || '').trim().substring(0, 30)).filter(Boolean).join(' | ');
        console.log('[gdrive] Buttons:', names || '(none)');
        if (s > 5) { console.log('[gdrive] Done - no more buttons'); break; }
        continue;
      }
      if (found.disabled) { console.log('[gdrive] disabled:', found.textContent.trim()); continue; }
      console.log('[gdrive] Click:', found.textContent.trim());
      found.click();
      await sleep(2500);
    }
  })

.check_all_plugins: &check_all_plugins |
  (async () => {
  	const boxes = document.querySelectorAll('button[role="checkbox"][id^="plugins_"]');
  	for (const b of boxes) {
  		if (b.getAttribute('aria-checked') !== 'true') b.click();
  	}
  	console.log('plugins checked:', boxes.length);
  })

